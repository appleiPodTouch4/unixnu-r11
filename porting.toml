[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform", "SoftwareAES"]
paths = ["dts/r11.dts", "configs/r11_defconfig"]
inputs = ["8 cores in two clusters: MPIDR 0x0-0x3 (A53 class, part 0x801) and 0x100-0x103 (A73 class, part 0x800).", "GICv3 distributor 0x17a00000 and redistributors 0x17b00000 (8 x 0x20000), 19.2 MHz arch timer, PSCI over SMC."]
configuration = ["dts/r11.dts includes sdm660.dtsi and tags cpu0-3 as E and cpu4-7 as P with unixnu,cluster-type.", "Kernel arguments r11-smp=1 and armcpu-spi-ipi=1."]
procedure = ["Compile dts/r11.dts, inspect the ADT cpu nodes and the /arm-io ranges.", "Record per-CPU entry and timer/IPI delivery on the device."]
findings = ["SDM660 exposes both clusters with 4 cores each; per-CPU reg values are affinities, not indices, so ADT output must keep 0x100-0x103 for the gold cluster.", "The arch timer interrupts are PPI 13/14/11/10, matching the SDM660 platform include used by the firmware.", "The cpu@N nodes carry no unixnu,adt-name: the generator exports a tagged node as a direct child of /arm-io and rewrites reg as physical address minus the arm-io base, so an exported cpu would place affinity 0x0 below the 16 MiB base. /cpus is built from these same children instead, and the resulting ADT has cpu0-7 in MPIDR order under /cpus.", "Device, boot-irq10: ArmCpu::start() reaches step 0x10 (IRQ action registered) and initCPU() gets through both enableCPUTimeBase(true) calls and the (false) between them, then stops with T=0x26 -- the marker written immediately before armcpu_gic_snapshot(). The panel rows are a 48 s snapshot: they are repainted when the console is written, not by the event timer, so the boot stopped at 48 s and the panel stopped with it. The S=/T= text is written straight to scanout and stays live.", "The two independent stops of this bring-up are the only two places that touch ICC_HPPIR0/1_EL1 in the whole kext: boot-irq7 stopped at T=0x24 (armcpu_sgi_selfprobe polls it after sending its SGIs) and boot-irq10 at T=0x26 (armcpu_gic_snapshot reads it first). That correlation, not the timer, is the current best lead on 'the GIC never delivers'.", "THE INTERRUPT WALL, found by the boot-irq16 AUD panel row: pend=40200000 (ISPENDR0 bit 30 asserted), isen=8000001 (bit 27 only), daif=200 (I clear), wak=0, act=0, tirq=0. The arch timer had been firing into INTID 30 the whole time while the driver enabled INTID 27 -- Apple GIC numbering, not SDM660. soc/dts/sdm660.dtsi gives the four arch-timer PPIs as <1 13> <1 14> <1 11> <1 10> = INTIDs 29/30/27/26, and in the arm,armv8-timer order the second entry is the EL1 virtual timer that CNTV drives. ArmCpu now takes the PPI from armcpu-timer-intid (default 30) instead of hardcoding 27, and the AUD row carries tid= so a photograph always names the INTID in use.", "Correction to the earlier DS note: GICD_TYPER.SecurityExtn is bit 10 of GICD_TYPER and dtyp=7b04f3 has it SET, which means the GIC implements the security extensions (two security states), not a single-security-state GIC. From a Non-secure access GICD_CTLR.EnableGrp0 (bit 0) and EnableGrp1S (bit 2) are RAZ/WI, which is why dctl reads 0x12 (EnableGrp1NS + ARE_NS) after writing 0x13. IGROUPR0 reading back 0 has the same cause: a Non-secure read of a Group 0 register."]
completion = ["All eight CPUs reach their entry checkpoint and the timer ticks on every core."]
limits = ["No CPU frequency or idle driver: r11-cpufreq is passed but no board driver implements it.", "Secondary cores stay off (no sheng-smp): the boot CPU's GIC and machine timer are not delivering yet."]
next_action = ["Boot boot-irq17.img (armcpu-timer-intid=30): read the panel row 45 AUD tid=/tirq=/pend=. tirq rising and pend bit30 clearing means the EL1 virtual timer is finally delivered; then bsd_init should print calling dlil_init and reach vfs_mountroot, where qcom_emmc_rootdev() takes over."]

