result = "GPT geometry: boot 245760-376831, userdata grow from LBA 10944512, 69 partitions"

[[area]]
id = "display"
status = "planned"
components = ["GopFramebuffer"]
paths = ["inputs/r11-stock.dts", "dts/r11.dts", "board.toml"]
inputs = ["Samsung S6E3FA3 AMOLED 1080x1920, command mode, single DSI, 60 Hz (qcom,mdss_dsi_oppo16051samsung_s6e3fa3_1080p_cmd).", "MDSS 0xc900000+0x90000, DSI PLL/PHY 0xc994400, MMSS SMMU 0xcd00000.", "Continuous splash buffer 0x9D400000+0x02400000."]
configuration = ["Firmware: USE_CUSTOM_DISPLAY_DRIVER = 0, SimpleFbDxe over PcdFrameBuffer 1080x1920x32.", "Kernel: offline-legacy-gop=1 renders the console into GOP; CONFIG_XNU_NATIVE_LEGACY_DISPLAY=n."]
procedure = ["Boot the FD and confirm the menu over the OPPO boot logo.", "Then write a DSI panel driver replaying the init sequence from inputs/r11-stock.dts."]
findings = ["The panel node in the stock tree holds 79 properties including the full init, timing and PHY tables, so the sequence does not have to be reverse engineered from the kernel binary.", "SimpleFbDxe finds its buffer by the Display Reserved region name, which is why MemoryMapLib keeps that exact string."]
completion = ["Menu, then XNU console, then a framebuffer handoff at native resolution over the real MDSS driver."]
limits = ["No MDSS/DSI driver. Display works only as long as the vendor bootloader leaves the panel on and the framebuffer untouched.", "No backlight control: r11-backlight is passed but unimplemented."]
next_action = ["Extract the panel init sequence into driver tables and bring up DSI in command mode with a test pattern."]

