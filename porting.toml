[[area]]
id = "packaging"
status = "implemented"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "inputs/hw.json", "inputs/partitions.json"]
inputs = ["Stock boot image header: version 0, page 4096, kernel 0x8000, ramdisk 0x1000000, tags 0x100, second 0xf00000.", "IPSW: iPad Pro 17.7.11 (21H461), product iPad7,1, chip_id 0x8011."]
configuration = ["[bootimg.image] mirrors the stock header; [payload] volume R11ESP, size 192 MiB, loader firmware.", "No [[bootimg.dtb_node]]: the stock tree already has /reserved-memory/splash_region."]
procedure = ["./unixnu build kernel -D ../UniXNU-r11 (macOS 12 host, scripts/xnu-clang)", "./unixnu build payload --unique-chip-id <hex> --trust-cache <bundle>", "./unixnu bootimg -D ../UniXNU-r11 --uefi ../uefi-r11-base --dtb ../uefi-r11-base/Platforms/OPPO/r11Pkg/DeviceTree/r11.dtb"]
findings = ["OPPO uses tags 0x100 rather than the usual 0x1e00000; bootimg verifies the load addresses and rejects a wrong offset.", "The boot partition is 64 MiB while the payload is 192 MiB, so the image must go through fastboot boot, not fastboot flash boot.", "The stock boot image is gzip(Image) plus a multi-DTB block of three trees; the firmware DTB for bootimg is the single 16051 tree.", "Measured on this host: kernel.macho 53,792,768 bytes (prelinked, sha256 7cf8d413d5c7edcf...), ADT 15,688 bytes, payload.img 201,326,592 bytes, boot.img 202,670,080 bytes with kernel (BootShim) 1,338,688 bytes at 0x8000 and the payload as ramdisk at 0x1000000. The payload volume holds EFI/UniXNU/unixnu.toml, Payloads/kernel.macho and Payloads/kernel.macho.adt."]
completion = ["boot.json reports the expected kernel address, tags address and a nonzero ramdisk size, and the image boots to the UniXNU menu."]
limits = ["Payload size assumes fastboot boot with max-download 512 MiB (reported by getvar on the reference unit)."]
next_action = ["fastboot boot the 202,670,080-byte image with the chip id seed set and capture the first serial checkpoint after the UniXNU menu selects xnu."]

