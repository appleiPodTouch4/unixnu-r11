schema_version = 1

[device]
name = "r11"
soc = "SDM660"
os_profile = "ipados-17.7.11-21H461"
summary = "OPPO R11 (CPH1707 / 16051) on SDM660 + PM660/PM660L. Board inputs, firmware and boot image are derived from the device's own OFP package; the storage, display, input and power drivers are not written yet."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "patches/**", ".github/**", ".gitignore"]
inputs = ["SDM660 shared support (../UniXNU-sdm660-common), iPadOS 17.7.11 build 21H461 profile, r11 defconfig.", "OFP package model 16051: boot.img, gpt_main0.bin, xbl.elf."]
configuration = ["schema_version = 2; board.soc_source = sdm660; board.os_profile = ipados-17.7.11-21H461.", "kernel.defconfig = r11_defconfig; fragments arch + soc + os; device patch series present but empty.", "kernel.archives lists the arch-profile scripts because arrays replace inherited arrays."]
procedure = ["python3 scripts/extract-inputs.py --ofp ../ofp_extracted", "./unixnu defconfig r11_defconfig -D ../UniXNU-r11", "./unixnu status --json -D ../UniXNU-r11"]
findings = ["The OFP boot image carries three appended device trees for board-id subtypes 0x3eb3, 0x3ee7 and 0x3ef6; 0x3eb3 is the 16051 tree and is the one committed as inputs/r11-stock.dtb.", "The stock device tree leaves /memory at zero because ABL patches it from SMEM, so the 4 GiB window is taken from hardware measurement and must be confirmed on the target device.", "The SoC layer has no published repository yet; feeds.toml points at a sibling checkout, so the build is not reproducible from a clean clone until it is pushed and pinned.", "The arm-io window is derived, not declared: arm_io_window() takes the lowest and highest exported register range and aligns them to 16 MiB, and it rejects a zero base. With the cpu, i2c-slave and DSI-panel nodes untagged the window is base 0x03000000 size 0x84000000, and arm-io gets ten children (interrupt-controller, timer, tlmm, spmi, emmc, i2c1, mdss, dsi0, smem, imem)."]
completion = ["defconfig and status resolve arch, SoC, OS and device layers; every referenced file exists."]
limits = ["SoC source is local, not pinned. No unixnu.lock yet: nothing git-hosted is selected besides the UniXNU defaults."]
next_action = ["Push UniXNU-sdm660-common, switch feeds.toml to git plus a commit, run unixnu fetch and commit unixnu.lock."]

[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Format 2 board configuration with values traced to inputs/hw.json"

[[area]]
id = "firmware"
status = "implemented"
components = ["DarwinBoot"]
paths = ["scripts/check-r11.py", "proprietary-files.txt", "inputs/r11-stock.dtb"]
inputs = ["uefi-r11 platform package in Mu-Silicium layout, adapted from the SDM660 reference platform.", "Stock XBL memory reservation strings, stock boot image geometry, stock device tree."]
configuration = ["firmware.dsc = Platforms/OPPO/r11Pkg/r11.dsc; firmware.config = r11; fd = Build/r11Pkg/{target}_CLANGPDB/FV/R11_UEFI.fd.", "FD base 0x9FC00000 and size 0x300000 in Resources/Configs/r11.toml, r11.dsc and the BootShim compile flags.", "The FDF embeds UniXNU, UniXNUDxe, UniXNURamDiskDxe, DarwinBoot, DiskIoDxe, PartitionDxe and Fat."]
procedure = ["uefi-r11/scripts/prepare-base.sh (Mu-Silicium + Mu_Basecore + vendor binaries).", "./unixnu build firmware -D ../UniXNU-r11 --uefi ../uefi-r11-base --edk2 ../Mu_Basecore", "python3 scripts/check-r11.py (also runs as the firmware preflight)."]
findings = ["The stock xbl.elf is UEFI 4.1 (SDM660 LA) and reserves exactly the windows the platform uses: DXE Heap 0x94000000+0x09400000, UEFI FD 0x9FC00000+0x00300000, UEFI Stack 0x9FF90000+0x00040000.", "SimpleFbDxe locates the framebuffer by the memory-map region name Display Reserved; the stock splash reservation 0x9D400000+0x02400000 matches that region, so the menu can be drawn over the vendor boot logo without an MDSS driver.", "The panel driver is the one vendor piece that cannot be reused: the reference SDM660 DisplayDxe targets a different panel, so USE_CUSTOM_DISPLAY_DRIVER stays 0.", "No ACPI tables are built: UniXNU hands XNU an ADT and nothing else consumes ACPI on this target."]
completion = ["The FD builds at exactly 0x300000 bytes, BootShim carries the same base and size, and the boot image round-trips through unixnu bootimg."]
limits = ["Vendor DXE binaries are seeded from a sibling SDM660 UEFI device; charger and battery profiles and the button GPIO map are not R11 values yet.", "No R11 panel driver, so DisplayDxe is disabled."]
next_action = ["Build the FD on a macOS or Linux host and record the output size, then boot it with fastboot boot and capture the framebuffer checkpoint."]

[[area.evidence]]
kind = "source"
reference = "scripts/check-r11.py"
result = "Preflight checks the Display Reserved region the SDM660 memory map must keep; the map itself lives in the sibling uefi-r11 repository"

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu", "ArmDTPlatform", "SoftwareAES"]
paths = ["dts/r11.dts", "configs/r11_defconfig"]
inputs = ["8 cores in two clusters: MPIDR 0x0-0x3 (A53 class, part 0x801) and 0x100-0x103 (A73 class, part 0x800).", "GICv3 distributor 0x17a00000 and redistributors 0x17b00000 (8 x 0x20000), 19.2 MHz arch timer, PSCI over SMC."]
configuration = ["dts/r11.dts includes sdm660.dtsi and tags cpu0-3 as E and cpu4-7 as P with unixnu,cluster-type.", "Kernel arguments r11-smp=1 and armcpu-spi-ipi=1."]
procedure = ["Compile dts/r11.dts, inspect the ADT cpu nodes and the /arm-io ranges.", "Record per-CPU entry and timer/IPI delivery on the device."]
findings = ["SDM660 exposes both clusters with 4 cores each; per-CPU reg values are affinities, not indices, so ADT output must keep 0x100-0x103 for the gold cluster.", "The arch timer interrupts are PPI 13/14/11/10, matching the SDM660 platform include used by the firmware.", "The cpu@N nodes carry no unixnu,adt-name: the generator exports a tagged node as a direct child of /arm-io and rewrites reg as physical address minus the arm-io base, so an exported cpu would place affinity 0x0 below the 16 MiB base. /cpus is built from these same children instead, and the resulting ADT has cpu0-7 in MPIDR order under /cpus."]
completion = ["All eight CPUs reach their entry checkpoint and the timer ticks on every core."]
limits = ["No CPU frequency or idle driver: r11-cpufreq is passed but no board driver implements it."]
next_action = ["Record the first ARMCPU checkpoint from a device boot with serial=3 and the framebuffer console."]

[[area.evidence]]
kind = "source"
reference = "dts/r11.dts"
result = "Two-cluster MPIDR layout (0x0-0x3, 0x100-0x103) with E/P cluster types, taken from the stock device tree"

[[area]]
id = "memory"
status = "implemented"
components = ["XnuPrelink"]
paths = ["dts/r11.dts", "inputs/hw.json", "scripts/extract-inputs.py"]
inputs = ["Handoff window 0x80000000 + 0xFE4C0000 (bank0 2 GiB plus bank1 0x7E4C0000, adjacent).", "Reservations: splash 0x9D400000+0x02400000, removed_regions 0x85800000+0x03700000, modem 0x8AC00000+0x07E00000, ADSP 0x92A00000+0x02000000, CDSP 0x94C00000+0x00600000."]
configuration = ["payload.dram_size = 0xFE4C0000 must equal the /memory reg, the ADT generator rejects a mismatch.", "payload.adt.owned_memory_size = 0xC0000000 (3 GiB)."]
procedure = ["Compare the firmware memory map, the DTS reservations and the ADT /chosen/dram-base and dram-size.", "Check that the FD window 0x9FC00000+0x300000 stays outside every reservation."]
findings = ["The ADT generator accepts exactly one contiguous DRAM range, so the two adjacent banks are described as one range.", "The FD window sits above the splash reservation and below the stack window, matching the stock XBL layout.", "The stock tree zeroes /memory: any value here is an assumption about the retail unit and must be confirmed."]
completion = ["XNU reports the expected physical memory and no driver allocates inside a reserved region."]
limits = ["3 GiB owned memory is a first-bring-up value; the remaining ~1 GiB stays with the firmware and reservations."]
next_action = ["Read the real SMEM DRAM size on the device and update dts/r11.dts, payload.dram_size and owned_memory_size together."]

[[area.evidence]]
kind = "source"
reference = "inputs/hw.json"
result = "DRAM window and every reserved region decoded from the stock device tree and GPT images"

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/**", "configs/r11_defconfig"]
inputs = ["eMMC 5.1 on sdhci@c0c4000 (0x0C0C4000, core 0x0C0C5000), 512-byte LBA, non-A/B.", "GPT (inputs/partitions.json): boot 245760-376831 (64 MiB), userdata grow from 10944512, 69 partitions."]
configuration = ["[userdata] first_lba 0x14E000, last_lba 0xE8F7FA, lba_bytes 4096.", "CONFIG_XNU_NATIVE_UFS=n and CONFIG_XNU_NATIVE_RAM_BLOCK=n for the first bring-up; the root is mockfs."]
procedure = ["Write a board eMMC driver (SDHCI v5 with SDM660 clocks and GDSC), then enable CONFIG_XNU_NATIVE_RAM_BLOCK.", "Build the userdata image with unixnu build userdata and record the volume UUID back into board.toml."]
findings = ["userdata is a grow partition in the shipped GPT (size 0), so its end LBA depends on the eMMC capacity; the value here is the 64 GiB mapping.", "root_match_volume_uuid is zero until the userdata image exists."]
completion = ["The kernel mounts an APFS root from eMMC and the payload can address block slices."]
limits = ["No XNU eMMC driver. UEFI storage exists through the vendor SdccDxe, which is enough to read the payload but not to run the kernel stack."]
next_action = ["Port the SDHCI driver from the SDM660 kernel sources and verify a read of partition 21 (boot) first."]

[[area.evidence]]
kind = "source"
