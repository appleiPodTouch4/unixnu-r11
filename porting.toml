[[area]]
id = "storage"
status = "planned"
components = []
paths = ["drivers/**", "configs/r11_defconfig", "patches/xnu/qcom-emmc-root.patch", "patches/xnu/zzz-no-root-media-panic.patch"]
inputs = ["eMMC 5.1 on sdhci@c0c4000 (0x0C0C4000, core 0x0C0C5000), 512-byte LBA, non-A/B.", "GPT (inputs/partitions.json): boot 245760-376831 (64 MiB), userdata grow from 10944512, 69 partitions."]
configuration = ["[userdata] first_lba 0x14E000, last_lba 0xE8F7FA, lba_bytes 4096.", "CONFIG_XNU_NATIVE_UFS=n and CONFIG_XNU_NATIVE_RAM_BLOCK=n for the first bring-up; the root is mockfs."]
procedure = ["Write a board eMMC driver (SDHCI v5 with SDM660 clocks and GDSC), then enable CONFIG_XNU_NATIVE_RAM_BLOCK.", "Build the userdata image with unixnu build userdata and record the volume UUID back into board.toml."]
findings = ["userdata is a grow partition in the shipped GPT (size 0), so its end LBA depends on the eMMC capacity; the value here is the 64 GiB mapping.", "root_match_volume_uuid is zero until the userdata image exists.", "bsd/dev/qcom_emmc.c (837 lines, added by patches/xnu/qcom-emmc-root.patch) had never executed before boot-irq18: its only entry point is qcom_emmc_rootdev(), called from vfs_mountroot(), and bsd_init never reached vfs_mountroot() because IOKitBSDInit() panicked first while waiting for an IOMedia with Content=Apple_HFS. boot-irq18 adds patches/xnu/zzz-no-root-media-panic.patch so the mount loop runs and the probe reports its verdict on the boot panel.", "The IOMedia wait is the real gate, not just a panic: IOService::waitForService matches IOMedia+Apple_HFS by default (IOKitBSDInit.cpp:906), so a storage driver that merely assigns rootdev is not enough -- something must publish an IOMedia.", "Reference implementation: the OPPO R11T Arch Linux package (HEDC2333, 2026-07-24). Its kernel carries an appended DTB and, decompiled, it is the only known-good description of this board's eMMC. mmc@c0c4000 there requires clocks iface/core/xo/ice (GCC 0x16008 / 0x16004 / xo_board / 0x1600c), a GCC reset, rpmpd power-domain 0, vmmc = pm660l l4 at 2.95 V, vqmmc = pm660 l8 at 1.8 V, 8-bit bus, HS200/HS400. Both rails sit under regulators-0 with compatible = \"qcom,rpm-pm660l-regulators\" and carry no regulator-always-on, so Linux enables them through the RPM co-processor -- which XNU has no driver for. The unmodified boot image is staged at boot-control/boot-archlinux-r11t-ref.img and a repack in this board's geometry at boot-control/boot-archlinux-r11t-oppo.img; booting the repack leaves the panel dark because that kernel only reaches console=ttyMSM0/earlycon, so it cannot be used as an on-screen diagnostic. Never boot the installer recovery: its cmdline carries r11t.install_target=all r11t.storage_write=1.",]
completion = ["The kernel mounts an APFS root from eMMC and the payload can address block slices."]
limits = ["No XNU eMMC driver has completed a read on hardware yet. UEFI storage exists through the vendor SdccDxe, which is enough to read the payload but not to run the kernel stack.", "Nothing publishes an IOMedia yet, so IOKitBSDInit cannot find a root media; boot-irq18 only stops it from panicking there."]
next_action = ["Boot boot-irq19.img and read panel row 27 'EMMC st=.. err=.. blk=..': st names how many BP_STAGE checkpoints inside qcom_emmc_init() were passed (2 = maps+clocks returned, 3 = hung at the first SDHCI_CAPABILITIES read, 4 = caps read, 5 = CMD sequence done, 6 = GPT partition found, >=7 = bdevsw registered) and err is its return code.", "Then fix whatever that stage names, and publish an IOMedia so APFS can attach -- or mount HFS+ straight from rootdev, which needs no IOMedia. The userdata-root.img (7.78 GiB, OS window at 0x100000, SystemOS at 0x14fa00000, root volume UUID 97A3EB1A-5218-4936-BC85-9574EC2C8CC9) is built and waiting for 'fastboot flash userdata'."]

