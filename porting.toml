schema_version = 1

[device]
name = "r11"
soc = "SDM660"
os_profile = "ipados-17.7.11-21H461"
summary = "OPPO R11 (CPH1707 / 16051) on SDM660 + PM660/PM660L. Board inputs, firmware and boot image are derived from the device's own OFP package; the storage, display, input and power drivers are not written yet."

[[area]]
id = "configuration"
status = "implemented"
components = []
paths = ["board.toml", "feeds.toml", "configs/**", "patches/**", ".github/**", ".gitignore"]
inputs = ["SDM660 shared support (../UniXNU-sdm660-common), iPadOS 17.7.11 build 21H461 profile, r11 defconfig.", "OFP package model 16051: boot.img, gpt_main0.bin, xbl.elf."]
configuration = ["schema_version = 2; board.soc_source = sdm660; board.os_profile = ipados-17.7.11-21H461.", "kernel.defconfig = r11_defconfig; fragments arch + soc + os; device patch series present but empty.", "kernel.archives lists the arch-profile scripts because arrays replace inherited arrays."]
procedure = ["python3 scripts/extract-inputs.py --ofp ../ofp_extracted", "./unixnu defconfig r11_defconfig -D ../UniXNU-r11", "./unixnu status --json -D ../UniXNU-r11"]
findings = ["The OFP boot image carries three appended device trees for board-id subtypes 0x3eb3, 0x3ee7 and 0x3ef6; 0x3eb3 is the 16051 tree and is the one committed as inputs/r11-stock.dtb.", "The stock device tree leaves /memory at zero because ABL patches it from SMEM, so the 4 GiB window is taken from hardware measurement and must be confirmed on the target device.", "The SoC layer has no published repository yet; feeds.toml points at a sibling checkout, so the build is not reproducible from a clean clone until it is pushed and pinned.", "The arm-io window is derived, not declared: arm_io_window() takes the lowest and highest exported register range and aligns them to 16 MiB, and it rejects a zero base. With the cpu, i2c-slave and DSI-panel nodes untagged the window is base 0x03000000 size 0x84000000, and arm-io gets ten children (interrupt-controller, timer, tlmm, spmi, emmc, i2c1, mdss, dsi0, smem, imem).", "boot-irq12 panicked in NativeAES::MetaClass::alloc() -> bsd_init -> IOKitBSDInit -> doServiceMatch because scripts/data/native-aes-original-bindings.S binds IOAESAccelerator's methods to absolute addresses from a different prelink layout: 0xfffffff004a80038 holds zeros both at its recorded value and 16 MiB above it in this board's kernel.macho, while the original kernelcache has code at 0xfffffff005a80038. emit_prelink repacks kext code, and com.apple.iokit.IOCryptoAcceleratorFamily IS in the --root list, so the failure is the binding table, not a missing root. CONFIG_XNU_NATIVE_AES=n in configs/r11_defconfig removes the personality so IOKit never instantiates the class.", "Editing configs/r11_defconfig alone changes nothing: the build reads out/<device>/<profile>/<config>/.config, which 'unixnu defconfig r11_defconfig -D ../UniXNU-r11' generates by appending the defconfig after the arch/SoC/OS fragments. parse_config keeps the LAST value, so the defconfig wins -- but only after the file is regenerated. boot-irq13 proved this the hard way: identical panic with CONFIG_XNU_NATIVE_AES=n in the defconfig and =y still in .config."]
completion = ["defconfig and status resolve arch, SoC, OS and device layers; every referenced file exists."]
limits = ["SoC source is local, not pinned. No unixnu.lock yet: nothing git-hosted is selected besides the UniXNU defaults.", "With CONFIG_XNU_NATIVE_AES=n there is no hardware AES accelerator and NativeVirtioBlock/NativeRamBlock stay unavailable; the binding table must be re-audited against this board's own prelink output before any of them can be enabled."]
next_action = ["Push UniXNU-sdm660-common, switch feeds.toml to git plus a commit, run unixnu fetch and commit unixnu.lock."]

